# =============================================================
#  docker-compose.yml — Infraestructura LOCAL sistema-micro-pagos
#  ⚠ VIVE EN: backend/infra/docker-compose.yml (dentro del backend)
#  Rationale: Autonomía. Si backend se convierte en REPO GIT
#  INDEPENDIENTE, se lleva su Dockerfile, su compose, su nginx,
#  su initdb Postgres, sus volumes config — NUNCA le falta nada.
#  Servicios: PostgreSQL 16, Redis 7.2, Nginx, Adminer
#  Backend + Frontends se añaden con docker-compose.override.yml
# =============================================================

name: micropay-local

services:

  # ──────────────────────────────────────────────────────────
  #  POSTGRESQL 16 — Datos OLTP + ACID
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: micropay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-micropay}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      TZ: America/Bogota
      PGTZ: America/Bogota
    volumes:
      - micropay_postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c work_mem=16MB
        -c max_connections=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c timezone='America/Bogota'
        -c log_timezone='America/Bogota'
        -c jit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-micropay}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - micropay-net

  # ──────────────────────────────────────────────────────────
  #  REDIS 7.2 — Caché + Bloqueos + Velocity Counters
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: micropay-redis
    restart: unless-stopped
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lfu
        --save 60 1000
        --timeout 300
        --tcp-keepalive 60
    volumes:
      - micropay_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping:health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
    networks:
      - micropay-net

  # ──────────────────────────────────────────────────────────
  #  ADMINER — GUI para PostgreSQL (solo dev)
  # ──────────────────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1-standalone
    container_name: micropay-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
      TZ: America/Bogota
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - micropay-net

  # ──────────────────────────────────────────────────────────
  #  NGINX — Proxy inverso local (rutea frontends + backend)
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: micropay-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_LISTEN_PORT:-8080}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/error_pages:/usr/share/nginx/html/_errors:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - micropay-net

# ──────────────────────────────────────────────────────────────
#  VOLÚMENES PERSISTENTES
# ──────────────────────────────────────────────────────────────
volumes:
  micropay_postgres_data:
    name: micropay_postgres_data
  micropay_redis_data:
    name: micropay_redis_data

# ──────────────────────────────────────────────────────────────
#  RED DEDICADA DOCKER
# ──────────────────────────────────────────────────────────────
networks:
  micropay-net:
    name: micropay-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
