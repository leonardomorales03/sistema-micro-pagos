# =============================================================
#  nginx/dev.conf — Proxy inverso LOCAL sistema-micro-pagos
#
#  Hosts locales:
#    http://localhost:8080/                  → Frontend Usuario
#    http://localhost:8080/admin/            → Frontend Admin
#    http://localhost:8080/api/v1/*          → Backend Spring Boot
#    http://localhost:8080/actuator/*        → Spring Actuator
#    http://localhost:8080/swagger-ui/*      → SpringDoc Swagger UI
#    http://localhost:8080/v3/api-docs/*     → OpenAPI JSON/YAML
#    http://localhost:8080/healthz           → Healthcheck Nginx
# =============================================================

server {
    listen 80;
    server_name _;

    # ────────────────────────────────────────────
    #  GENERAL
    # ────────────────────────────────────────────
    charset utf-8;
    client_max_body_size 10M;
    server_tokens off;

    # Logs
    access_log  /var/log/nginx/micropay.access.log  main_combined;
    error_log   /var/log/nginx/micropay.error.log   warn;

    # Request ID (trackea transacciones a través de servicios)
    add_header X-Request-ID $request_id always;
    proxy_set_header X-Request-ID $request_id;

    # ────────────────────────────────────────────
    #  UPSTREAMS (hosts de docker-compose / local)
    # ────────────────────────────────────────────
    upstream backend_upstream {
        server backend:8080 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }
    upstream frontend_user_upstream {
        server frontend-user:5173;
    }
    upstream frontend_admin_upstream {
        server frontend-admin:5174;
    }

    # ────────────────────────────────────────────
    #  HEALTHCHECK NGINX (sin pasar a upstreams)
    # ────────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 '{"status":"healthy","service":"nginx","timestamp":""}';
        default_type application/json;
        add_header Content-Type application/json;
    }

    # ────────────────────────────────────────────
    #  BACKEND — /api/*
    # ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Connection         "";

        # Buffers + timeouts razonables para pagos
        proxy_buffering         on;
        proxy_buffer_size       16k;
        proxy_buffers           4 32k;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;

        # IMPORTANTE: Pasar cookies de Refresh Token HttpOnly al backend
        proxy_pass_request_headers on;
        proxy_pass_request_cookies on;
    }

    # ────────────────────────────────────────────
    #  SPRING ACTUATOR — /actuator/*
    # ────────────────────────────────────────────
    location /actuator/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Bloquear endpoints sensibles en dev (siempre filtrar por red en prod)
        location ~ ^/actuator/(heapdump|threaddump|logfile|shutdown|restart) {
            deny all;
        }
    }

    # ────────────────────────────────────────────
    #  SPRINGDOC SWAGGER UI + OpenAPI spec
    # ────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host  $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v3/api-docs {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ────────────────────────────────────────────
    #  FRONTEND ADMIN — /admin/* (MATCH ANTES de /)
    # ────────────────────────────────────────────
    location /admin/ {
        # Quitar prefijo /admin/ antes de pasar al SPA
        rewrite ^/admin/(.*)$ /$1 break;

        proxy_pass http://frontend_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_cache_bypass                  $http_upgrade;

        # Vite HMR (Hot Module Reload) en dev
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;
    }

    # ────────────────────────────────────────────
    #  FRONTEND USUARIO — / (SPA catch-all)
    # ────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_user_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_cache_bypass                  $http_upgrade;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;

        # SPA history mode fallback: si el archivo no existe, entrega index.html
        # Nota: el Vite dev server ya hace esto; es backup para build estático
        try_files $uri $uri/ /index.html;
    }

    # ────────────────────────────────────────────
    #  ERRORES ESTÁTICOS
    # ────────────────────────────────────────────
    error_page 404 /_errors/404.html;
    error_page 500 502 503 504 /_errors/5xx.html;

    location = /_errors/404.html {
        root /usr/share/nginx/html;
        internal;
    }
    location = /_errors/5xx.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Denegar acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
