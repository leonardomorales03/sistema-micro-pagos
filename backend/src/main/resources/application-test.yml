# =============================================================
#  application-test.yml — PERFIL TESTS (JUnit + Docker Compose local)
#  Valores estables y deterministas; sin random
#  Nota: Alternativa A T11 — containers Docker Compose existentes
#        postgres :5432 / redis :6379 — credenciales desarrollo local
# =============================================================
logging:
  level:
    root: WARN
    com.micropay.backend: INFO
    org.testcontainers: WARN
    org.testcontainers.docker: WARN
  pattern.console: "%d{HH:mm:ss.SSS} [%-5level] %logger{36} - %msg%n"
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
  config:
    activate.on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5432/micropay_test
    username: app_user
    password: changeme_local_only
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MicropayHikariTestPool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    show-sql: false
    properties.hibernate.generate_statistics: false
  flyway:
    enabled: true
    clean-disabled: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 15
      timeout: 2000ms
  cache:
    type: redis
  mail:
    host: localhost
    port: 25
    properties.mail.smtp.starttls.enable: false

# JWT — clave estática y de prueba SOLO para CI/tests
micropay.jwt:
  secret-key: Y3JpdGljYWxseS11bnNhZmUtand0LXNlY3JldC1mb3ItdGVzdGluZy1vbmx5LWFuZC1jb250ZXh0
  access-token-expiration-ms: 300000
  refresh-token-expiration-ms: 86400000
  issuer: micropay-backend-test

# Stripe — todas las operaciones Mock; NO real
micropay.stripe:
  publishable-key: pk_test_FAKE00000000000000000000000000
  secret-key: sk_test_FAKE00000000000000000000000000
  webhook-signing-secret: whsec_FAKE00000000000000000000000000
  connect-client-id: ca_FAKE00000000000000000000000000

# Actuator mínimo en tests
management.endpoints.web.exposure.include: health
