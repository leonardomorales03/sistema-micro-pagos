# =============================================================
#  application.yml — BACKEND MICROPAGOS (Configuración BASE)
#  Perfiles: dev | test | sandbox | prod
#  NO poner secretos aquí — usar variables de entorno o perfil
# =============================================================
spring:
  application:
    name: sistema-micro-pagos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      dev: dev,actuator-info
      test: test
      sandbox: sandbox,dev,actuator-info
      prod: prod,actuator-info
  main:
    banner-mode: console
    allow-bean-definition-overriding: false
    web-application-type: servlet
  messages:
    basename: i18n/messages
    encoding: UTF-8
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 2048

# =============================================================
#  DATASOURCE — PostgreSQL (sobreescrito por perfil)
# =============================================================
spring.datasource:
  url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/micropay}
  username: ${SPRING_DATASOURCE_USERNAME:app_user}
  password: ${SPRING_DATASOURCE_PASSWORD:}
  driver-class-name: org.postgresql.Driver
  hikari:
    pool-name: MicropayHikariPool
    maximum-pool-size: 20
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    leak-detection-threshold: 60000
    auto-commit: false

# =============================================================
#  JPA / HIBERNATE — validate NUNCA create-drop
# =============================================================
spring.jpa:
  open-in-view: false
  hibernate.ddl-auto: validate
  show-sql: ${SPRING_JPA_SHOW_SQL:false}
  format-sql: true
  properties:
    hibernate:
      # PostgreSQL16Dialect NO existe en Hibernate 6.x (SB3.3); usar genérico PostgreSQLDialect — auto-detecta 16 por driver)
      dialect: org.hibernate.dialect.PostgreSQLDialect
      default_schema: public
      jdbc.batch_size: 50
      order_inserts: true
      order_updates: true
      query.in_clause_parameter_padding: true
      generate_statistics: false

# =============================================================
#  FLYWAY — Migraciones versionadas
# =============================================================
spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  out-of-order: false
  validate-on-migrate: true
  encoding: UTF-8

# =============================================================
#  REDIS — Caché + Bloqueos + Velocity Counters
# =============================================================
spring.data.redis:
  host: ${SPRING_DATA_REDIS_HOST:localhost}
  port: ${SPRING_DATA_REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DB:0}
  timeout: 2000ms
  lettuce:
    pool:
      max-active: 20
      max-idle: 10
      min-idle: 5
      max-wait: 1000ms

# =============================================================
#  CACHÉ SPRING + RedisCacheManager
# =============================================================
spring.cache:
  type: redis
  redis:
    time-to-live: 60000
    cache-null-values: false
    use-key-prefix: true
    key-prefix: "micropay::"

# =============================================================
#  SEGURIDAD — JWT (claves por variable entorno)
# =============================================================
micropay.jwt:
  secret-key: ${SPRING_JWT_SECRET_KEY:}
  access-token-expiration-ms: ${SPRING_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${SPRING_JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
  refresh-token-cookie-name: ${SPRING_JWT_REFRESH_TOKEN_COOKIE_NAME:MICROPAY_REFRESH_TOKEN}
  issuer: ${SPRING_JWT_ISSUER:micropay-backend}

# =============================================================
#  STRIPE — Pagos (perfil dev/test usa claves sandbox)
# =============================================================
micropay.stripe:
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-signing-secret: ${STRIPE_WEBHOOK_SIGNING_SECRET:}
  connect-client-id: ${STRIPE_CONNECT_CLIENT_ID:}
  account-country: ${STRIPE_ACCOUNT_COUNTRY:CO}
  api-version: "2024-09-30.acacia"

# =============================================================
#  OPENAPI — SpringDoc (genera spec y swagger UI)
# =============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
  openapi:
    info:
      title: Sistema de Micro-Pagos API
      version: 0.1.0
      description: API v1 oficial del Sistema de Micro-Pagos (Hexagonal + ACID)
      terms-of-service: https://example.com/terms
      contact:
        name: API Support
        email: api-support@micropay.example
    version: "3.1.0"
  show-actuator: true
  writer-with-default-pretty-printer: true

# =============================================================
#  ACTUATOR — Monitoreo (exponer sólo endpoints seguros)
# =============================================================
management:
  endpoints:
    web:
      exposure.include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes.enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env.enabled: true
    build.enabled: true
    java.enabled: true
    os.enabled: true

# =============================================================
#  SCHEDULER DISTRIBUIDO — ShedLock (Redis)
# =============================================================
micropay.shedlock:
  enabled: true
  default-lock-at-most-for: 10m
  default-lock-at-least-for: 1m

# =============================================================
#  LÍMITES — Globales (Wallet + Transferencias)
#  Valores por defecto; fork-CO sobreescribe en su perfil
# =============================================================
micropay.limits:
  global:
    min-transaction-amount: 100
    max-daily-total: 20000000
    max-monthly-total: 100000000
    max-transactions-per-10min: 15
    max-withdraw-percent-of-balance: 0.25
    withdraw-hold-days: 2
    withdraw-window-days: 15
  kyc:
    level0-daily-limit: 1000000
    level0-monthly-limit: 5000000
    level1-daily-limit: 10000000
    level1-monthly-limit: 50000000
    level2-daily-limit: 50000000
    level2-monthly-limit: 300000000
  payment-request:
    short-code-length: 6
    expiration-hours: 24

# =============================================================
#  MULTI-MONEDA — Tasas y USD$1 max en sandbox (T26, Requisito 29)
#  · micropay.multicurrency.enabled: flag de NEGOCIO (T26). OFF por
#    defecto → el sistema se comporta EXACTAMENTE igual que sin FX.
#  · micropay.fx.*: adaptador FX configurable (stub sandbox determinista
#    + cache Redis TTL corto). En producción se sustituye por un
#    proveedor externo real sin cambiar el contrato FxRatePort.
#  · rates: mapa <BASE><QUOTE> -> rate (unidades de QUOTE por 1 BASE).
# =============================================================
micropay.multicurrency:
  enabled: ${FEATURE_MULTICURRENCY_ENABLED:false}

micropay.fx:
  enabled: true
  default-currency: COP
  cache-ttl-seconds: ${MICROPAY_FX_CACHE_TTL_SECONDS:120}
  rates:
    USDCOP: 4100.00
    EURCOP: 4500.00
    USDEUR: 0.91
    ARSCOP: 4.60
    BRLCOP: 720.00
    JPYCOP: 27.00
  sandbox-max-usd: 1.00

# =============================================================
#  REFERRALS — 5% flat, umbral $10 (T27 / Requisito 31)
#  Modelo: al cumplirse la ACCIÓN CUALIFICANTE (un retiro del invitee
#  >= withdrawal-threshold-amount en su moneda) el referrer recibe un
#  bono = reward-percent x monto cualificante. min-kyc-level gatea el KYC
#  mínimo del invitee; qualifying-action es documental (hoy: WITHDRAWAL).
# =============================================================
micropay.referrals:
  enabled: true
  reward-percent: 0.05
  withdrawal-threshold-amount: 10.00
  withdrawal-threshold-currency: USD
  min-kyc-level: ${MICROPAY_REFERRALS_MIN_KYC:LEVEL_1}
  qualifying-action: ${MICROPAY_REFERRALS_QUALIFYING_ACTION:WITHDRAWAL}
  invite-base-url: ${MICROPAY_REFERRALS_INVITE_BASE_URL:https://app.micropay.example/register}

# =============================================================
#  FEES — FeeEngine configurable y versionado (Requisito 30)
#  Todos en 0 por defecto (sin comisión). Al activar una tarifa,
#  subir `version` para que las tx históricas referencien su regla.
# =============================================================
micropay.fees:
  version: v1-default
  transfer-p2p:
    percentage: 0
  topup:
    percentage: 0
  withdrawal:
    flat: 0
  payment-request:
    mdr-percentage: 0
  subscription:
    percentage: 0

# =============================================================
#  SUBSCRIPTIONS — Facturación recurrente (Requisito 22)
#  El scheduler corre cada hora (cron 6 campos: seg min hora ...).
#  Dunning: tras cada fallo se reintenta +1, +3 y +7 días;
#  agotados los reintentos la suscripción pasa a CANCELED.
# =============================================================
micropay.subscriptions:
  billing:
    cron: "0 5 * * * *"
    batch-size: 100
  dunning:
    retry-days: 1,3,7

# =============================================================
#  NOTIFICACIONES — Canal EMAIL (Requisito 25, T22)
#  El log IN_APP siempre se persiste en `user_notifications`.
#  EMAIL está deshabilitado por defecto (dev/tests no envían).
# =============================================================
micropay.notifications:
  email:
    enabled: ${MICROPAY_NOTIF_EMAIL_ENABLED:false}
    from: ${MICROPAY_NOTIF_EMAIL_FROM:no-reply@micropay.example}
    subject-prefix: ${MICROPAY_NOTIF_EMAIL_SUBJECT_PREFIX:[MicroPay]}

# =============================================================
#  WEBHOOKS A COMERCIOS — Firma HMAC + reintentos (Requisito 25.4)
#  Backoff: 1m, 5m, 15m, 1h, 6h, 24h (~24h total, configurable).
# =============================================================
micropay.webhooks:
  timeout-ms: ${MICROPAY_WEBHOOK_TIMEOUT_MS:5000}
  batch-size: ${MICROPAY_WEBHOOK_BATCH_SIZE:100}
  retry-cron: "0 */1 * * * *"
  retry-delays: 1m,5m,15m,1h,6h,24h

# =============================================================
#  RISK ENGINE — AntiFraude + velocity (Requisito 27, T23)
# =============================================================
micropay.risk:
  enabled: ${MICROPAY_RISK_ENABLED:true}
  challenge-ttl-seconds: ${MICROPAY_RISK_CHALLENGE_TTL:300}
  first-topup-max: ${MICROPAY_RISK_FIRST_TOPUP_MAX:100}
  topup-per-day-unverified: ${MICROPAY_RISK_TOPUP_PER_DAY_UNVERIFIED:2}
  large-withdrawal-threshold: ${MICROPAY_RISK_LARGE_WITHDRAWAL:1000}
  large-refund-threshold: ${MICROPAY_RISK_LARGE_REFUND:1000}
  cross-border-blocklist: [CUBA, IRAN, NORTH_KOREA, RUSSIA, SYRIA]
  velocity:
    p2p-per-minute: ${MICROPAY_RISK_P2P_PER_MIN:10}
    p2p-per-hour: ${MICROPAY_RISK_P2P_PER_HOUR:100}
    p2p-per-day: ${MICROPAY_RISK_P2P_PER_DAY:500}

# =============================================================
#  ADMIN BACKOFFICE — RBAC avanzado (T24, Requisitos 26.x)
#  · require-mfa: cuando TRUE, el backoffice debe reforzar el MFA
#    obligatorio. La infra MFA ya existe (infrastructure/security/
#    MfaService.java + SandboxMfaService.java); este flag queda como
#    configuración del gate (el enforcement de MFA por método se
#    difiere a la tarea de seguridad 34.3 para no romper el flujo actual).
#  · rate-limit-per-minute: límite de peticiones al backoffice por minuto
#    (referencia; el filtrado de límite se aplicará a nivel de infra proxy).
# =============================================================
micropay.admin:
  require-mfa: ${MICROPAY_ADMIN_REQUIRE_MFA:false}
  rate-limit-per-minute: ${MICROPAY_ADMIN_RATE_LIMIT:120}

# =============================================================
#  REPORTS — Exports CSV asíncronos + Cashflow (T25, Requisito 28)
#  · storage-dir: directorio local del storage (adaptador sustituible por S3).
#  · download-ttl-hours: caducidad del enlace de descarga (token).
#  · poll-cron / poll-batch-size: poller que procesa los jobs en estado QUEUED.
# =============================================================
micropay.reports:
  storage-dir: ${MICROPAY_REPORTS_STORAGE_DIR:./build/reports}
  download-ttl-hours: ${MICROPAY_REPORTS_DOWNLOAD_TTL_HOURS:24}
  max-rows: ${MICROPAY_REPORTS_MAX_ROWS:50000}
  poll-cron: "0 */1 * * * *"
  poll-batch-size: ${MICROPAY_REPORTS_POLL_BATCH:10}

# =============================================================
#  RECONCILIACIÓN — Comparación interno vs proveedor (T25, Requisito 28.3)
#  · providers: lista separada por comas de proveedores a reconciliar.
#  · cron: ejecución diaria (por defecto 02:00) del día anterior.
# =============================================================
micropay.reconciliation:
  enabled: ${MICROPAY_RECONCILIATION_ENABLED:true}
  providers: ${MICROPAY_RECONCILIATION_PROVIDERS:stripe}
  cron: "0 0 2 * * *"
